@if (navigating()) {
  <div
    class="fixed inset-x-0 top-0 z-50 h-0.5 overflow-hidden bg-accent/20"
    role="progressbar"
    aria-label="Loading page"
  >
    <div class="h-full w-1/3 bg-accent animate-pulse motion-reduce:animate-none"></div>
  </div>
}

<forge-shell [hasSidebar]="authService.isAuthenticated()" mobileTitle="Phyrexian Forge">
  <app-navbar *ngIf="authService.isAuthenticated()" brand section="brand" />
  <app-navbar *ngIf="authService.isAuthenticated()" nav section="nav" />
  <app-navbar *ngIf="authService.isAuthenticated()" user section="user" />

  <router-outlet />
</forge-shell>

<app-roll-toast />
<app-command-palette />
