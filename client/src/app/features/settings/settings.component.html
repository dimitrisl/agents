<forge-page
  title="⚙️ Phyrexian Forge Settings"
  subtitle="Configure AI model parameters, edition defaults, and system options."
>
  <div class="mx-auto flex w-full max-w-150 flex-col gap-5">
    <forge-section variant="plain" density="comfortable">
      <label
        for="default-edition"
        class="font-display text-body-sm font-semibold text-ink"
      >
        Default D&D Edition:
      </label>
      <select
        forgeSelect
        id="default-edition"
        [ngModel]="charState.dndEdition()"
        (ngModelChange)="onEditionChange($event)"
      >
        <option value="2014 Edition">2014 Legacy Edition (5e)</option>
        <option value="2024 Revision (5.5e)">2024 Revision (5.5e)</option>
      </select>
    </forge-section>

    <forge-section variant="plain" density="comfortable">
      <label
        for="ai-temperature"
        class="font-display text-body-sm font-semibold text-ink"
      >
        AI Temperature (Creativity: {{ aiTemperature }}):
      </label>
      <input
        id="ai-temperature"
        type="range"
        min="0.0"
        max="1.0"
        step="0.1"
        [(ngModel)]="aiTemperature"
        class="settings-range h-2 w-full cursor-pointer rounded-full bg-black/45 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-deep"
      />
    </forge-section>

    <forge-section variant="plain" density="comfortable">
      <label
        for="preferred-model"
        class="font-display text-body-sm font-semibold text-ink"
      >
        Preferred Gemini Model:
      </label>
      <select forgeSelect id="preferred-model" [(ngModel)]="preferredModel">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Fast)</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro (Deep Reasoning)</option>
      </select>
    </forge-section>

    <div>
      <button
        forgeButton
        variant="primary"
        type="button"
        (click)="saveSettings()"
      >
        💾 Save Preferences
      </button>
    </div>
  </div>
</forge-page>
