<forge-modal
  title="🎲 Request a Roll"
  [open]="open"
  (openChange)="openChange.emit($event)"
  (closed)="closed.emit()"
>
  <div class="flex flex-col gap-4">
    <label
      class="flex flex-col gap-2 text-label font-semibold uppercase tracking-wide text-muted"
    >
      Target Member:
      <select
        forgeSelect
        [ngModel]="rollTargetMember"
        (ngModelChange)="rollTargetMemberChange.emit($event)"
      >
        @if (partyMembers.length > 1) {
          <option value="ALL">👥 All Party Members ({{ partyMembers.length }})</option>
        }
        <option *ngFor="let member of partyMembers" [value]="member.char_id || member.name">
          {{ member.name }}@if (member.owner_username) { (&#64;{{ member.owner_username }}) }
        </option>
      </select>
    </label>

    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <label
        class="flex flex-col gap-2 text-label font-semibold uppercase tracking-wide text-muted"
      >
        Roll Type:
        <select
          forgeSelect
          [ngModel]="rollType"
          (ngModelChange)="rollTypeChange.emit($event)"
        >
          <option value="ability_check">Ability Check</option>
          <option value="skill_check">Skill Check</option>
          <option value="saving_throw">Saving Throw</option>
          <option value="attack_roll">Attack Roll</option>
          <option value="initiative">Initiative</option>
        </select>
      </label>
      <label
        class="flex flex-col gap-2 text-label font-semibold uppercase tracking-wide text-muted"
      >
        <ng-container *ngIf="rollType === 'skill_check'; else statLabel">Skill:</ng-container>
        <ng-template #statLabel>Stat:</ng-template>
        <select
          forgeSelect
          [ngModel]="rollStat"
          (ngModelChange)="rollStatChange.emit($event)"
        >
          <ng-container *ngIf="rollType === 'skill_check'; else statOptions">
            <option *ngFor="let skill of skills" [value]="skill">{{ skill }}</option>
          </ng-container>
          <ng-template #statOptions>
            <option *ngFor="let stat of stats" [value]="stat">{{ stat }}</option>
          </ng-template>
        </select>
      </label>
    </div>

    <label
      class="flex flex-col gap-2 text-label font-semibold uppercase tracking-wide text-muted"
    >
      Reason / Context:
      <input
        forgeInput
        type="text"
        [ngModel]="rollReason"
        (ngModelChange)="rollReasonChange.emit($event)"
        placeholder="e.g. Dragon Breath Fire Save"
      />
    </label>

    <label
      class="flex flex-col gap-2 text-label font-semibold uppercase tracking-wide text-muted"
    >
      Manual / Physical Dice Roll (1–20, optional):
      <input
        forgeInput
        type="number"
        min="1"
        max="20"
        [ngModel]="manualRoll"
        (ngModelChange)="manualRollChange.emit($event)"
        placeholder="e.g. 17 (leave blank for player digital roll)"
      />
    </label>

    <div class="flex flex-col gap-1">
      <label
        for="dm-secret-roll"
        class="flex cursor-pointer items-center gap-2 rounded-lg text-body text-gold focus-within:ring-2 focus-within:ring-accent focus-within:ring-offset-2 focus-within:ring-offset-deep"
      >
        <input
          id="dm-secret-roll"
          type="checkbox"
          class="h-4 w-4 accent-(--color-accent) focus-visible:outline-none"
          [ngModel]="isSecretRoll"
          (ngModelChange)="isSecretRollChange.emit($event)"
        />
        🔒 Mark as a secret roll
      </label>
      <p class="text-micro text-muted">
        Rolled silently by the server against the hero's sheet — only the DM sees the request and
        result.
      </p>
    </div>

    <div class="flex justify-end gap-2">
      <button
        forgeButton
        variant="secondary"
        type="button"
        (click)="openChange.emit(false)"
      >
        Cancel
      </button>
      <button forgeButton type="button" (click)="requestRoll.emit()">
        Request Roll
      </button>
    </div>
  </div>
</forge-modal>
