<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4">
  <div class="w-full max-w-2xl bg-surface border border-hairline rounded shadow-xl flex flex-col max-h-[90vh]">
    <!-- Header -->
    <div class="flex items-center justify-between p-4 border-b border-hairline">
      <h2 class="text-xl font-bold text-ink flex items-center gap-2">
        <span class="text-accent">🔥</span> AI Homebrew Forge
      </h2>
      <button
        forgeButton
        variant="ghost"
        size="md"
        iconOnly
        type="button"
        aria-label="Close AI Homebrew Forge"
        (click)="closeModal.emit()"
      >
        <forge-icon name="close" />
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 overflow-y-auto">

      <!-- STEP 1 -->
      <div *ngIf="step === 1" class="space-y-4">
        <h3 class="font-semibold text-lg">Step 1: What are you creating?</h3>
        <div class="flex gap-4">
          <label class="flex-1 border border-hairline rounded p-4 text-center cursor-pointer hover:border-accent" [class.bg-accent]="selectedType === 'weapon'" [class.text-white]="selectedType === 'weapon'">
            <input type="radio" name="type" value="weapon" [(ngModel)]="selectedType" class="hidden">
            <div class="font-bold text-lg">Weapon</div>
          </label>
          <label class="flex-1 border border-hairline rounded p-4 text-center cursor-pointer hover:border-accent" [class.bg-accent]="selectedType === 'spell'" [class.text-white]="selectedType === 'spell'">
            <input type="radio" name="type" value="spell" [(ngModel)]="selectedType" class="hidden">
            <div class="font-bold text-lg">Spell</div>
          </label>
          <label class="flex-1 border border-hairline rounded p-4 text-center cursor-pointer hover:border-accent" [class.bg-accent]="selectedType === 'feat'" [class.text-white]="selectedType === 'feat'">
            <input type="radio" name="type" value="feat" [(ngModel)]="selectedType" class="hidden">
            <div class="font-bold text-lg">Feat</div>
          </label>
          <label class="flex-1 border border-hairline rounded p-4 text-center cursor-pointer hover:border-accent" [class.bg-accent]="selectedType === 'monster'" [class.text-white]="selectedType === 'monster'">
            <input type="radio" name="type" value="monster" [(ngModel)]="selectedType" class="hidden">
            <div class="font-bold text-lg">Monster</div>
          </label>
        </div>
        <div class="flex justify-end mt-4">
          <button class="bg-ink text-surface px-4 py-2 rounded" (click)="nextStep()">Continue</button>
        </div>
      </div>

      <!-- STEP 2 -->
      <div *ngIf="step === 2" class="space-y-6">

        <!-- AI Assist Block -->
        <div class="bg-tile border border-hairline rounded p-4 space-y-3">
          <label class="font-semibold text-sm">AI Assist: Describe what you want</label>
          <div class="flex gap-2">
            <textarea [(ngModel)]="aiPrompt" rows="2" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="e.g. A cursed dagger that heals the user but poisons them on a 1..."></textarea>
            <button class="bg-accent text-white px-4 rounded whitespace-nowrap" (click)="forgeWithAI()" [disabled]="isForging">
              {{ isForging ? 'Forging...' : 'Auto-Fill' }}
            </button>
          </div>
        </div>

        <!-- Strict Guided Form -->
        <div class="grid grid-cols-2 gap-4">
          <div class="col-span-2">
            <label class="text-xs font-bold text-muted uppercase">Name</label>
            <input [(ngModel)]="formData.name" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink">
          </div>

          <!-- WEAPON FIELDS -->
          <ng-container *ngIf="selectedType === 'weapon'">
            <div>
              <label class="text-xs font-bold text-muted uppercase">Damage Dice</label>
              <input [(ngModel)]="formData['damage_dice']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="1d8">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Attack Bonus</label>
              <input [(ngModel)]="formData['attack_bonus']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="+0">
            </div>
          </ng-container>

          <!-- SPELL FIELDS -->
          <ng-container *ngIf="selectedType === 'spell'">
            <div>
              <label class="text-xs font-bold text-muted uppercase">Level</label>
              <input [(ngModel)]="formData['level']" type="number" class="w-full bg-surface border border-hairline rounded p-2 text-ink">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">School</label>
              <input [(ngModel)]="formData['school']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="Evocation">
            </div>
          </ng-container>

          <!-- MONSTER FIELDS -->
          <ng-container *ngIf="selectedType === 'monster'">
            <div>
              <label class="text-xs font-bold text-muted uppercase">Size</label>
              <input [(ngModel)]="formData['size']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="Medium">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Type</label>
              <input [(ngModel)]="formData['type']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="humanoid, beast, undead...">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Alignment</label>
              <input [(ngModel)]="formData['alignment']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="unaligned">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Challenge Rating (CR)</label>
              <input [(ngModel)]="formData['cr']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="1">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Armor Class (AC)</label>
              <input [(ngModel)]="formData['ac']" type="number" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="10">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Hit Points (HP)</label>
              <input [(ngModel)]="formData['hp']" type="number" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="10">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Speed</label>
              <input [(ngModel)]="formData['speed']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="30 ft.">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Senses</label>
              <input [(ngModel)]="formData['senses']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="Darkvision 60 ft., passive Perception 12">
            </div>
            <div>
              <label class="text-xs font-bold text-muted uppercase">Languages</label>
              <input [(ngModel)]="formData['languages']" type="text" class="w-full bg-surface border border-hairline rounded p-2 text-ink" placeholder="Common, Goblin">
            </div>

            <!-- Ability Scores -->
            <div class="col-span-2">
              <label class="text-xs font-bold text-muted uppercase mb-1 block">Ability Scores</label>
              <div class="grid grid-cols-6 gap-2" *ngIf="formData['stats']">
                <div>
                  <span class="text-micro font-bold text-muted block text-center">STR</span>
                  <input [(ngModel)]="formData['stats'].str" type="number" class="w-full bg-surface border border-hairline rounded p-1 text-center text-ink text-sm">
                </div>
                <div>
                  <span class="text-micro font-bold text-muted block text-center">DEX</span>
                  <input [(ngModel)]="formData['stats'].dex" type="number" class="w-full bg-surface border border-hairline rounded p-1 text-center text-ink text-sm">
                </div>
                <div>
                  <span class="text-micro font-bold text-muted block text-center">CON</span>
                  <input [(ngModel)]="formData['stats'].con" type="number" class="w-full bg-surface border border-hairline rounded p-1 text-center text-ink text-sm">
                </div>
                <div>
                  <span class="text-micro font-bold text-muted block text-center">INT</span>
                  <input [(ngModel)]="formData['stats'].int" type="number" class="w-full bg-surface border border-hairline rounded p-1 text-center text-ink text-sm">
                </div>
                <div>
                  <span class="text-micro font-bold text-muted block text-center">WIS</span>
                  <input [(ngModel)]="formData['stats'].wis" type="number" class="w-full bg-surface border border-hairline rounded p-1 text-center text-ink text-sm">
                </div>
                <div>
                  <span class="text-micro font-bold text-muted block text-center">CHA</span>
                  <input [(ngModel)]="formData['stats'].cha" type="number" class="w-full bg-surface border border-hairline rounded p-1 text-center text-ink text-sm">
                </div>
              </div>
            </div>

            <div class="col-span-2">
              <label class="text-xs font-bold text-muted uppercase">Traits (one per line, e.g. Pack Tactics: ...)</label>
              <textarea [(ngModel)]="formData['traits_text']" rows="2" class="w-full bg-surface border border-hairline rounded p-2 text-ink"></textarea>
            </div>
            <div class="col-span-2">
              <label class="text-xs font-bold text-muted uppercase">Actions (one per line, e.g. Bite: +4 to hit, 1d6+2 piercing)</label>
              <textarea [(ngModel)]="formData['actions_text']" rows="2" class="w-full bg-surface border border-hairline rounded p-2 text-ink"></textarea>
            </div>
          </ng-container>

          <!-- SHARED FIELDS -->
          <div class="col-span-2">
            <label class="text-xs font-bold text-muted uppercase">Description & Mechanics</label>
            <textarea [(ngModel)]="formData['description']" rows="4" class="w-full bg-surface border border-hairline rounded p-2 text-ink"></textarea>
          </div>
        </div>

      </div>
    </div>

    <!-- Footer -->
    <div *ngIf="step === 2" class="p-4 border-t border-hairline flex justify-between bg-tile rounded-b">
      <button class="text-muted hover:text-ink px-4 py-2" (click)="step = 1">Back</button>
      <button class="bg-accent text-white px-6 py-2 rounded font-bold hover:bg-accent/90" (click)="save()">Save Homebrew</button>
    </div>
  </div>
</div>
