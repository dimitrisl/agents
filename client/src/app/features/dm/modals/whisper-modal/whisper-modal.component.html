<forge-modal
  title="💬 Secret Whisper Chat"
  [open]="open"
  (openChange)="openChange.emit($event)"
  (closed)="closed.emit()"
>
  <div class="flex flex-col gap-4">
    <label class="flex flex-col gap-2 text-label font-semibold uppercase tracking-wide text-muted">
      Recipient:
      <select forgeSelect [ngModel]="whisperRecipient" (ngModelChange)="whisperRecipientChange.emit($event)">
        <option value="All">All Players</option>
        <option *ngFor="let member of partyMembers" [value]="member.name">{{ member.name }}</option>
      </select>
    </label>

    <label class="flex flex-col gap-2 text-label font-semibold uppercase tracking-wide text-muted">
      Message:
      <textarea forgeTextarea rows="3" [ngModel]="whisperMessage" (ngModelChange)="whisperMessageChange.emit($event)"></textarea>
    </label>

    <div class="flex justify-end gap-2">
      <button forgeButton variant="secondary" type="button" (click)="openChange.emit(false)">Close</button>
      <button forgeButton type="button" (click)="send.emit()">Send Whisper</button>
    </div>
  </div>
</forge-modal>
