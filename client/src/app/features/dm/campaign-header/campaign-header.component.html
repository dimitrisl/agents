<header
  class="flex flex-col gap-4 border-b border-hairline pb-4 lg:flex-row lg:items-center lg:justify-between"
>
  <div class="min-w-0 lg:max-w-105">
    <div class="flex min-w-0 flex-wrap items-center gap-2">
      <p class="text-micro font-semibold uppercase text-accent">DM Workspace</p>
      <!-- Which ruleset the generators answer in — a 2024 table used to be handed
           2014 content with nothing on screen saying so. -->
      @if (editionShort) {
        <forge-badge tone="accent">{{ editionShort }} Rules</forge-badge>
      }
    </div>
    <h1 class="mt-1 truncate font-display text-[2rem] leading-tight text-ink">
      {{ campaignName }}
    </h1>
    <p class="mt-1 text-body text-muted">
      Campaign control center for notes, party state, initiative, generators and
      prep.
    </p>
  </div>

  <div
    class="flex min-w-0 flex-1 flex-col gap-3 md:flex-row md:flex-wrap md:items-center md:justify-end"
  >
    <label
      for="dm-campaign-select"
      class="relative flex min-h-16 min-w-0 items-center gap-3 rounded-xl border border-hairline bg-panel px-3 py-2 shadow-sm transition-colors hover:bg-tile focus-within:ring-2 focus-within:ring-accent focus-within:ring-offset-2 focus-within:ring-offset-deep md:w-[320px]"
    >
      <span class="sr-only">Select active campaign</span>
      <span
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-hairline bg-tile text-title"
        aria-hidden="true"
      >
        🏰
      </span>
      <span class="min-w-0 flex-1">
        <span class="block truncate text-body font-semibold text-ink">{{
          campaignName
        }}</span>
        <span class="block truncate text-label text-muted">
          {{
            inviteCode ? "Invite code · " + inviteCode : "No invite code yet"
          }}
        </span>
      </span>
      <span class="shrink-0 text-muted" aria-hidden="true">⌄</span>

      <select
        forgeSelect
        id="dm-campaign-select"
        class="absolute inset-0 h-full w-full cursor-pointer opacity-0"
        [ngModel]="campaignName"
        (ngModelChange)="campaignNameChange.emit($event)"
        (change)="campaignSelected.emit()"
      >
        <option
          *ngFor="let campaign of userCampaigns"
          [value]="campaign.campaign_name"
        >
          {{ campaign.campaign_name }}
        </option>
        <option *ngIf="userCampaigns.length === 0" [value]="campaignName">
          {{ campaignName }}
        </option>
      </select>
    </label>

    <div class="flex min-w-0 flex-wrap items-center gap-2">
      <button
        forgeButton
        variant="primary"
        type="button"
        (click)="sendWhisper.emit()"
      >
        💬 Send Whisper
      </button>
      <button
        forgeButton
        variant="secondary"
        type="button"
        (click)="createCampaign.emit()"
      >
        ➕ New Campaign
      </button>
      <button
        forgeButton
        variant="secondary"
        type="button"
        (click)="generateInvite.emit()"
      >
        🔑 Invite Code
      </button>
    </div>
  </div>
</header>
