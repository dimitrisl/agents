<forge-card class="text-center" [hoverable]="false" padding="lg">
  <ng-container *ngTemplateOutlet="logoTemplate"></ng-container>

  <h2 class="mb-6 flex items-center justify-center gap-2 font-display text-title text-accent">
    @if (isRegister) {
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
      </svg>
      Create Account
    } @else {
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
      </svg>
      Seasoned Adventurer
    }
  </h2>

  <div class="mb-4 text-left">
    <label for="auth-username" class="mb-2 block text-micro font-bold uppercase text-muted">Username:</label>
    <input
      id="auth-username"
      forgeInput
      type="text"
      [ngModel]="username"
      (ngModelChange)="usernameChange.emit($event)"
    />
  </div>

  <div class="mb-4 text-left">
    <label for="auth-password" class="mb-2 block text-micro font-bold uppercase text-muted">Password:</label>
    <input
      id="auth-password"
      forgeInput
      type="password"
      [ngModel]="password"
      (ngModelChange)="passwordChange.emit($event)"
      (keyup.enter)="submitAuth.emit()"
    />
  </div>

  @if (error) {
    <div class="mb-4 text-body text-crimson" role="alert">{{ error }}</div>
  }

  <div class="mt-6 flex flex-col gap-3">
    <button forgeButton variant="primary" size="md" fullWidth [loading]="submitting" [disabled]="discordSubmitting" (click)="submitAuth.emit()">
      @if (submitting) {
        {{ isRegister ? 'Creating account…' : 'Entering the Forge…' }}
      } @else {
        {{ isRegister ? 'Create Account' : 'Enter Forge' }}
      }
    </button>

    <button forgeButton variant="secondary" size="md" fullWidth [disabled]="submitting || discordSubmitting" (click)="toggleMode.emit()">
      {{ isRegister ? 'Already registered? Login' : 'New Hero? Register' }}
    </button>

    @if (discordEnabled) {
      <div class="my-1 flex items-center gap-3">
        <span class="h-px flex-1 bg-hairline"></span>
        <span class="text-micro uppercase text-muted">or</span>
        <span class="h-px flex-1 bg-hairline"></span>
      </div>

      <button
        forgeButton
        variant="secondary"
        size="md"
        fullWidth
        type="button"
        [loading]="discordSubmitting"
        [disabled]="submitting"
        (click)="discordLogin.emit()"
      >
        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z" />
        </svg>
        Sign in with Discord
      </button>
    }
  </div>

  <button class="mt-4" forgeButton variant="ghost" size="md" fullWidth (click)="back.emit()">
    <svg class="mr-2 h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
    </svg>
    Back to Choice
  </button>
</forge-card>
