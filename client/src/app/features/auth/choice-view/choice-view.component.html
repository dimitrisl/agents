<forge-card class="text-center" [hoverable]="false" padding="lg">
  <ng-container *ngTemplateOutlet="logoTemplate"></ng-container>

  <h1 class="font-display text-display text-accent">PHYREXIAN FORGE</h1>
  <p class="mb-7 mt-1 text-body italic text-muted">
    "All Will Be One &bull; 5e Legacy & 5.5e Edition"
  </p>

  <div class="flex flex-col gap-3">
    <button
      forgeButton
      variant="primary"
      size="lg"
      class="flex-col"
      (click)="chooseTutorial.emit()"
    >
      <div class="flex items-center gap-2">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
        </svg>
        I'm New Here!
      </div>
      <span class="text-label font-normal opacity-80">Start your first adventure tutorial</span>
    </button>

    <button
      forgeButton
      variant="secondary"
      size="lg"
      class="flex-col"
      (click)="chooseAuth.emit()"
    >
      <div class="flex items-center gap-2">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Seasoned Adventurer
      </div>
      <span class="text-label font-normal opacity-80">Enter the Forge with your credentials</span>
    </button>
  </div>
</forge-card>
