<div class="flex flex-col gap-5">
  <p class="text-body-sm text-muted">
    Choose your core pillars or let the AI decide!
  </p>

  <forge-section variant="plain" density="comfortable" title="Identity">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      <div>
        <label for="ai-race" class="mb-1 block text-label font-semibold text-muted">
          {{ is2024 ? 'Species' : 'Race' }}
        </label>
        <select
          forgeSelect
          id="ai-race"
          [(ngModel)]="aiRace"
          (ngModelChange)="aiRaceChange.emit($event)"
        >
          <option value="AI Choice">AI Choice</option>
          <option *ngFor="let r of raceOptions" [value]="r">{{ r }}</option>
        </select>
      </div>

      <div>
        <label for="ai-background" class="mb-1 block text-label font-semibold text-muted">
          Background
        </label>
        <select
          forgeSelect
          id="ai-background"
          [(ngModel)]="aiBackground"
          (ngModelChange)="aiBackgroundChange.emit($event)"
        >
          <option value="AI Choice">AI Choice</option>
          <option *ngFor="let b of bgOptions" [value]="b">{{ b }}</option>
        </select>
      </div>

      <div>
        <label for="ai-gender" class="mb-1 block text-label font-semibold text-muted">
          Gender
        </label>
        <select
          forgeSelect
          id="ai-gender"
          [(ngModel)]="aiGender"
          (ngModelChange)="aiGenderChange.emit($event)"
        >
          <option value="AI Choice">AI Choice</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
          <option value="Non-binary">Non-binary</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
  </forge-section>

  <forge-section variant="plain" density="comfortable" title="Class Plan">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
      <div>
        <label for="ai-class" class="mb-1 block text-label font-semibold text-muted">
          Class
        </label>
        <select
          forgeSelect
          id="ai-class"
          [(ngModel)]="aiClass"
          (ngModelChange)="aiClassChange.emit($event); updateSubclasses.emit()"
        >
          <option value="AI Choice">AI Choice</option>
          <option *ngFor="let c of classOptions" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div>
        <label for="ai-level" class="mb-1 block text-label font-semibold text-muted">
          Target Level
        </label>
        <input
          forgeInput
          id="ai-level"
          type="number"
          [(ngModel)]="aiLevel"
          min="1"
          max="20"
          (ngModelChange)="aiLevelChange.emit($event)"
          (change)="updateSubclasses.emit()"
        />
      </div>

      <div>
        <label for="ai-subclass" class="mb-1 block text-label font-semibold text-muted">
          Subclass
        </label>
        <select
          forgeSelect
          id="ai-subclass"
          [(ngModel)]="aiSubclass"
          [disabled]="subclassOptions.length <= 1"
          (ngModelChange)="aiSubclassChange.emit($event)"
        >
          <option *ngFor="let s of subclassOptions" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>
  </forge-section>

  <forge-section variant="plain" density="comfortable" title="Flavor">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div>
        <label for="ai-name" class="mb-1 block text-label font-semibold text-muted">
          Character Name (optional)
        </label>
        <input
          forgeInput
          id="ai-name"
          type="text"
          [(ngModel)]="aiName"
          placeholder="AI Choice"
          (ngModelChange)="aiNameChange.emit($event)"
        />
      </div>

      <div>
        <label for="ai-alignment" class="mb-1 block text-label font-semibold text-muted">
          Alignment
        </label>
        <select
          forgeSelect
          id="ai-alignment"
          [(ngModel)]="aiAlignment"
          (ngModelChange)="aiAlignmentChange.emit($event)"
        >
          <option value="AI Choice">AI Choice</option>
          <option *ngFor="let a of alignments" [value]="a">{{ a }}</option>
        </select>
      </div>
    </div>

    <div>
      <label for="ai-concept" class="mb-1 block text-label font-semibold text-muted">
        Additional Flavor / Concept:
      </label>
      <textarea
        forgeTextarea
        id="ai-concept"
        rows="3"
        [(ngModel)]="aiConcept"
        placeholder="E.g., A grumpy baker who uses a massive rolling pin as a weapon."
        (ngModelChange)="aiConceptChange.emit($event)"
      ></textarea>
    </div>

    <label class="inline-flex items-center gap-2 text-body-sm text-ink">
      <input
        type="checkbox"
        class="h-4 w-4 accent-[var(--theme-accent)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        [(ngModel)]="aiUseRolled"
        (ngModelChange)="aiUseRolledChange.emit($event)"
      />
      🎲 Use Rolled Stats (4d6 drop lowest)
    </label>
  </forge-section>

  <button
    forgeButton
    variant="primary"
    size="lg"
    fullWidth
    type="button"
    [disabled]="loading"
    (click)="generate.emit()"
  >
    {{ loading ? '⏳ Forging Character...' : 'Generate Character' }}
  </button>
</div>
