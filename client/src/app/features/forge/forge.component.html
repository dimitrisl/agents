<forge-page
  title="Forge a New Hero"
  subtitle="Generate an AI character or build one manually with rules-aware enrichment."
>
  @if (!tempForgedChar) {
    <div class="mx-auto flex w-full max-w-[900px] flex-col gap-5">
      <forge-tabs
        instanceId="forge-tabs"
        [tabs]="forgeTabs"
        [(activeId)]="activeTab"
      ></forge-tabs>

      @if (activeTab === 'ai') {
        <app-ai-form
          role="tabpanel"
          [attr.aria-labelledby]="'forge-tabs-tab-' + activeTab"
          [is2024]="is2024"
          [raceOptions]="raceOptions"
          [classOptions]="classOptions"
          [bgOptions]="bgOptions"
          [alignments]="alignments"
          [subclassOptions]="subclassOptions"
          [loading]="loading"
          [(aiRace)]="aiRace"
          [(aiClass)]="aiClass"
          [(aiBackground)]="aiBackground"
          [(aiLevel)]="aiLevel"
          [(aiGender)]="aiGender"
          [(aiSubclass)]="aiSubclass"
          [(aiConcept)]="aiConcept"
          [(aiName)]="aiName"
          [(aiAlignment)]="aiAlignment"
          [(aiUseRolled)]="aiUseRolled"
          (updateSubclasses)="updateSubclasses()"
          (generate)="generateAiCharacter()"
        ></app-ai-form>
      }

      @if (activeTab === 'manual') {
        <app-manual-form
          role="tabpanel"
          [attr.aria-labelledby]="'forge-tabs-tab-' + activeTab"
          [is2024]="is2024"
          [raceOptions]="raceOptions"
          [classOptions]="classOptions"
          [bgOptions]="bgOptions"
          [alignments]="alignments"
          [statKeys]="statKeys"
          [standardArrayValues]="standardArrayValues"
          [manualSubclassOptions]="manualSubclassOptions"
          [rolledScores]="rolledScores"
          [loading]="loading"
          [getFinalStat]="getFinalStat.bind(this)"
          [getModifierString]="getModifierString.bind(this)"
          [(manualName)]="manualName"
          [(manualLevel)]="manualLevel"
          [(manualGender)]="manualGender"
          [(manualRace)]="manualRace"
          [(manualClass)]="manualClass"
          [(manualBackground)]="manualBackground"
          [(manualAlignment)]="manualAlignment"
          [(manualSubclass)]="manualSubclass"
          [(manualConcept)]="manualConcept"
          [(manualStatMethod)]="manualStatMethod"
          [(manualStats)]="manualStats"
          [(adjPlus2)]="adjPlus2"
          [(adjPlus1)]="adjPlus1"
          [(adjPlus1Alt)]="adjPlus1Alt"
          (updateManualSubclasses)="updateManualSubclasses()"
          (rollStats)="roll4d6Stats()"
          (create)="createManualCharacter()"
        ></app-manual-form>
      }
    </div>
  }

  @if (tempForgedChar) {
    <app-hero-preview
      [hero]="tempForgedChar"
      [edition]="tempForgedChar.dnd_edition || charState.dndEdition()"
      [statKeys]="statKeys"
      [getClassColor]="getClassColor.bind(this)"
      [isPrimaryStat]="isPrimaryStat.bind(this)"
      [getModifierString]="getModifierString.bind(this)"
      (accept)="acceptAndEquipHero()"
      (discard)="discardHero()"
      (regeneratePortrait)="regeneratePortrait()"
    ></app-hero-preview>
  }
</forge-page>
