<forge-modal [open]="open" (openChange)="openChange.emit($event)" title="🔑 Join Campaign">
  <p class="mb-4 text-body text-muted">Enter the Invite Code provided by your DM:</p>
  <input
    forgeInput
    type="text"
    class="text-center text-title tracking-[2px]"
    [(ngModel)]="joinInviteCode"
    (ngModelChange)="joinInviteCodeChange.emit($event)"
    placeholder="Paste invite code"
  />
  <div class="mt-5 flex flex-col gap-2 sm:flex-row sm:justify-end">
    <button forgeButton variant="secondary" type="button" (click)="openChange.emit(false)">Cancel</button>
    <button forgeButton variant="primary" type="button" (click)="joinCampaign.emit()">Join Realm</button>
  </div>
</forge-modal>
