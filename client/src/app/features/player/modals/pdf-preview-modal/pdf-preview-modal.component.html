<forge-modal [open]="open" (closed)="closed.emit()" title="📄 Character Sheet Preview" maxWidth="1000px">
  <div class="flex h-[72vh] flex-col gap-4">
    <div class="min-h-0 flex-1 overflow-hidden rounded-lg border border-hairline bg-white">
      <iframe
        *ngIf="trustedPdfPreviewUrl"
        [src]="trustedPdfPreviewUrl"
        width="100%"
        height="100%"
        class="border-0"
      ></iframe>
    </div>
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <span class="text-body-sm text-muted">
        <strong class="text-gold">Pro Tip:</strong> Use your browser's Print menu and select "Save as PDF" to export.
      </span>
      <button forgeButton variant="secondary" type="button" (click)="closed.emit()">Close Preview</button>
    </div>
  </div>
</forge-modal>
