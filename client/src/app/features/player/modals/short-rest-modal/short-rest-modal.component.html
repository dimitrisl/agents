<forge-modal [open]="open" (openChange)="openChange.emit($event)" title="⛺ Short Rest & Hit Dice Healing">
  <p class="mb-4 text-body-sm text-muted">Spend Hit Dice during a 1-hour rest to recover lost Hit Points.</p>

  <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
    <div class="rounded-lg border border-hairline bg-black/20 p-3"><span class="block text-label text-muted">🎲 Hit Die Size</span><strong>d{{ classHitDieSize }}</strong></div>
    <div class="rounded-lg border border-hairline bg-black/20 p-3"><span class="block text-label text-muted">⚡ CON Modifier bonus per die</span><strong>+{{ conModifier }}</strong></div>
    <div class="rounded-lg border border-hairline bg-black/20 p-3"><span class="block text-label text-muted">❤️ Available Hit Dice</span><strong>{{ availableHitDice }} / {{ characterLevel }}</strong></div>
  </div>

  <div *ngIf="availableHitDice > 0" class="mt-4">
    <label for="short-rest-dice" class="mb-1 block text-label font-semibold text-muted">Number of Hit Dice to Spend:</label>
    <input forgeInput id="short-rest-dice" type="number" [(ngModel)]="shortRestDiceToSpend" (ngModelChange)="shortRestDiceToSpendChange.emit($event)" min="1" [max]="availableHitDice" />
  </div>

  <div *ngIf="availableHitDice === 0" class="mt-4 rounded-lg border border-red/40 bg-red/10 p-3 text-body-sm text-red">
    ⚠️ You have no available Hit Dice remaining! Take a Long Rest to recover Hit Dice.
  </div>

  <div class="mt-5 flex flex-col gap-2 sm:flex-row sm:justify-end">
    <button forgeButton variant="secondary" type="button" (click)="openChange.emit(false)">Cancel</button>
    <button *ngIf="availableHitDice > 0" forgeButton variant="primary" type="button" (click)="executeShortRest.emit()">⛺ Spend Hit Dice & Heal</button>
  </div>
</forge-modal>
