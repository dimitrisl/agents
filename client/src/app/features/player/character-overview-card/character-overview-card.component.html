<forge-card padding="sm" tone="accent" [hoverable]="false">
  <div class="divide-y divide-hairline/70">
    <section class="flex gap-3 pb-3">
      <button
        type="button"
        class="group relative h-24 w-24 shrink-0 overflow-hidden rounded-xl border border-accent/70 bg-panel focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-deep"
        aria-label="Change character portrait"
        (click)="portrait.emit()"
      >
        <img [src]="portraitUrl" alt="Character portrait" class="h-full w-full object-cover" />
        <span class="absolute inset-x-0 bottom-0 bg-black/75 px-2 py-1 text-micro font-semibold text-ink opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100">
          Portrait
        </span>
      </button>

      <div class="min-w-0 flex-1">
        <h2 *ngIf="!editMode" class="font-display text-title leading-snug text-ink">
          {{ char.char_name }}
        </h2>
        <input *ngIf="editMode" forgeInput type="text" class="w-full" [(ngModel)]="char.char_name" aria-label="Character name" />
        <forge-badge tone="accent" size="sm">{{ edition }}</forge-badge>

        <div *ngIf="!editMode" class="mt-2 space-y-1 text-body-sm text-muted">
          <p>{{ char.race }} <span *ngIf="char.subclass">({{ char.subclass }})</span></p>
          <p>{{ char.char_class }} • Level {{ char.char_level }}</p>
          <p>{{ char.background }}</p>
        </div>

        <div *ngIf="editMode" class="mt-3 grid grid-cols-1 gap-2">
          <input forgeInput type="text" [(ngModel)]="char.race" placeholder="Race" aria-label="Race" />
          <input forgeInput type="text" [(ngModel)]="char.char_class" placeholder="Class" aria-label="Class" />
          <input forgeInput type="text" [(ngModel)]="char.subclass" placeholder="Subclass" aria-label="Subclass" [readonly]="!canEditSubclass" [attr.aria-describedby]="!canEditSubclass ? 'overview-subclass-hint' : null" />
          <p *ngIf="!canEditSubclass" id="overview-subclass-hint" class="text-micro uppercase text-muted">Subclasses unlock at level 3</p>
          <input forgeInput type="number" [(ngModel)]="char.char_level" placeholder="Level" aria-label="Level" />
          <input forgeInput type="text" [(ngModel)]="char.background" placeholder="Background" aria-label="Background" />
        </div>
      </div>
    </section>

    <app-hit-points-control
      [current]="char.hp_current ?? char.hp_max"
      [max]="char.hp_max"
      (hpDown)="hpDown.emit()"
      (hpUp)="hpUp.emit()"
    ></app-hit-points-control>

    <app-combat-stat-grid
      [armorClass]="char.armor_class"
      [proficiencyBonus]="char.proficiency_bonus"
      [speed]="char.speed"
      [passivePerception]="passivePerception"
      [initiativeModifier]="char.initiative_modifier"
    ></app-combat-stat-grid>

    <div *ngIf="editMode" class="grid grid-cols-2 gap-2 py-3">
      <input forgeInput type="number" [(ngModel)]="char.armor_class" placeholder="Armor Class" aria-label="Armor Class" />
      <input forgeInput type="number" [(ngModel)]="char.speed" placeholder="Speed" aria-label="Speed" />
    </div>

    <app-ability-score-grid
      [char]="char"
      [entries]="abilityEntries"
      [editMode]="editMode"
      [getModifierString]="getModifierString"
      (abilityCheck)="abilityCheck.emit($event)"
      (savingThrow)="savingThrow.emit($event)"
    ></app-ability-score-grid>

    <div class="flex items-center justify-between gap-3 pt-3 text-body-sm">
      <span class="font-semibold uppercase text-muted">🎲 Hit Dice</span>
      <span class="font-semibold text-ink">{{ availableHitDice }} / {{ char.char_level }} (d{{ classHitDieSize }})</span>
    </div>
  </div>
</forge-card>
