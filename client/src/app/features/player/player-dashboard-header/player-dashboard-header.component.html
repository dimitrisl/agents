<header
  class="flex flex-col gap-4 border-b border-hairline pb-4 lg:flex-row lg:items-center lg:justify-between"
>
  <div class="min-w-0 lg:max-w-105">
    <p class="text-micro font-semibold uppercase text-accent">
      Player Dashboard
    </p>
    <h1
      class="mt-1 font-display text-[2rem] leading-tight text-ink sm:text-[2.25rem]"
    >
      {{ activeCharacter?.char_name || "Player Dashboard" }}
    </h1>
    <p class="mt-1 text-body text-muted">
      Manage your hero, track your abilities, and prepare for adventure.
    </p>
  </div>

  <div
    class="flex min-w-0 flex-1 flex-col gap-3 md:flex-row md:flex-wrap md:items-center md:justify-end"
  >
    @if (characters.length > 0) {
      <app-hero-switcher
        class="block min-w-0 md:w-80"
        [characters]="characters"
        [activeCharacter]="activeCharacter"
        [activeCharacterId]="activeCharacterId"
        [portraitUrl]="portraitUrl"
        (selectCharacter)="selectCharacter.emit($event)"
      />
    }

    <div class="flex min-w-0 flex-wrap items-center gap-2">
      <button
        forgeButton
        variant="primary"
        type="button"
        (click)="newHero.emit()"
      >
        ✦ New Hero
      </button>
      <button
        *ngIf="activeCharacter"
        forgeButton
        variant="secondary"
        type="button"
        (click)="editSheet.emit()"
      >
        ✎ Edit Sheet
      </button>
      <button
        *ngIf="activeCharacter"
        forgeButton
        variant="secondary"
        type="button"
        (click)="quickEdit.emit()"
      >
        {{ editMode ? "💾 Done Editing" : "⚡ Quick Edit" }}
      </button>
      <button
        *ngIf="activeCharacter"
        forgeButton
        variant="secondary"
        type="button"
        (click)="joinCampaign.emit()"
      >
        🔑 Join Campaign
      </button>
      <button
        *ngIf="activeCharacter"
        forgeButton
        variant="danger"
        type="button"
        (click)="deleteHero.emit()"
      >
        🗑️ Delete
      </button>
    </div>
  </div>
</header>
