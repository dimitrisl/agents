<forge-page>
  <app-player-dashboard-header
    [activeCharacter]="charState.activeCharacter()"
    [activeCharacterId]="charState.activeCharacter()?.char_id"
    [characters]="charState.filteredCharacters()"
    [editMode]="editMode"
    [portraitUrl]="charState.activeCharacter() ? getPortraitUrl(charState.activeCharacter()) : ''"
    (selectCharacter)="onSelectCharacter($event)"
    (newHero)="goToForge()"
    (editSheet)="openEditModal()"
    (quickEdit)="toggleEditMode()"
    (joinCampaign)="showJoinModal = true"
  ></app-player-dashboard-header>

  <ng-container *ngIf="charState.activeCharacter() as char; else emptyState">
    <div class="grid grid-cols-1 gap-6 xl:grid-cols-[340px_minmax(0,1fr)]">
      <aside class="flex min-w-0 flex-col gap-4 xl:sticky xl:top-6 xl:max-h-[calc(100vh-6rem)] xl:self-start xl:overflow-y-auto">
        <div *ngIf="char.active_campaign" class="rounded-lg border border-gold/30 bg-gold/10 px-4 py-2 text-body-sm text-gold">
          Member of Campaign: <strong>{{ char.active_campaign }}</strong>
        </div>

        <app-character-overview-card
          [char]="char"
          [editMode]="editMode"
          [edition]="char.dnd_edition || charState.dndEdition()"
          [portraitUrl]="getPortraitUrl(char)"
          [availableHitDice]="getAvailableHitDice()"
          [classHitDieSize]="getClassHitDieSize()"
          [passivePerception]="charState.passivePerception()"
          [abilityEntries]="getStatsArray(char.stats)"
          [getModifierString]="getModifierString.bind(this)"
          (portrait)="showPortraitModal = true"
          (hpDown)="adjustHp(-1)"
          (hpUp)="adjustHp(1)"
          (abilityCheck)="rollAbilityCheck($event)"
          (savingThrow)="rollSavingThrow($event)"
        ></app-character-overview-card>
      </aside>

      <section class="min-w-0">
        <forge-card padding="none" [hoverable]="false">
          <div class="flex min-h-0 flex-col">
            <div class="flex flex-col gap-3 border-b border-hairline p-4 lg:flex-row lg:items-center lg:justify-between">
              <app-character-tabs
                class="min-w-0 flex-1"
                [tabs]="sheetTabs"
                [activeId]="sheetSubTab"
                (activeIdChange)="selectSheetSubTab($event)"
              ></app-character-tabs>

              <app-roll-mode-selector
                class="min-w-0 shrink-0"
                [(rollMode)]="rollMode"
              ></app-roll-mode-selector>
            </div>

            <div class="min-w-0 p-4">
              <app-skills-panel
                *ngIf="sheetSubTab === 'skills'"
                [showProficientOnly]="showProficientOnly"
                (showProficientOnlyChange)="onShowProficientOnlyChange($event)"
                [openGroups]="openGroups"
                [attributes]="skillAttributes"
                [getSkillsByAttribute]="getSkillsByAttribute.bind(this)"
                [getAttributeFullName]="getAttributeFullName.bind(this)"
                [getAttributeModifier]="getAttributeModifier.bind(this)"
                [isProficient]="isProficient.bind(this)"
                [getSkillModString]="getSkillModString.bind(this)"
                (toggleGroup)="toggleGroup($event)"
                (rollAbility)="rollAbilityCheck($event)"
                (rollSkill)="rollSkillCheck($event)"
              ></app-skills-panel>

              <app-combat-panel
                *ngIf="sheetSubTab === 'combat'"
                role="tabpanel"
                [attr.aria-labelledby]="'player-tabs-tab-' + sheetSubTab"
                [char]="char"
                [editMode]="editMode"
                (addWeapon)="addWeapon()"
                (deleteWeapon)="deleteWeapon($event)"
                (rollWeaponAttack)="rollWeaponAttack($event)"
                (toggleEquipped)="toggleEquipped($event)"
                (addEquipment)="addEquipment()"
                (deleteEquipment)="deleteEquipment($event)"
                (save)="saveCurrentChar()"
              ></app-combat-panel>

              <app-spells-panel
                *ngIf="sheetSubTab === 'spells'"
                role="tabpanel"
                [attr.aria-labelledby]="'player-tabs-tab-' + sheetSubTab"
                [char]="char"
                [getSpellSlotUsed]="getSpellSlotUsed.bind(this)"
                [getSpellSlotMax]="getSpellSlotMax.bind(this)"
                (useSpellSlot)="useSpellSlot($event)"
                (restoreSpellSlot)="restoreSpellSlot($event)"
              ></app-spells-panel>

              <app-roleplay-panel
                *ngIf="sheetSubTab === 'roleplay'"
                role="tabpanel"
                [attr.aria-labelledby]="'player-tabs-tab-' + sheetSubTab"
                [char]="char"
                [editMode]="editMode"
                (save)="saveCurrentChar()"
              ></app-roleplay-panel>
            </div>

            <app-action-dock
              (shortRest)="openShortRestModal()"
              (longRest)="triggerLongRest()"
              (levelUp)="onLevelUp()"
              (audit)="onValidateCharacter()"
              (strategy)="onGenerateStrategy()"
              (exportPdf)="onExportPdf()"
            ></app-action-dock>
          </div>
        </forge-card>
      </section>
    </div>
  </ng-container>

  <ng-template #emptyState>
    <forge-empty-state
      icon="D20"
      title="No Heroes Found"
      description="Your vault is empty. It is time to forge a new legend."
    >
      <button forgeButton variant="primary" size="lg" type="button" (click)="goToForge()">
        Forge Your First Hero
      </button>
    </forge-empty-state>
  </ng-template>

  <app-pdf-preview-modal
    [open]="!!pdfPreviewUrl"
    [pdfPreviewUrl]="pdfPreviewUrl"
    (closed)="closePdfPreview()"
  ></app-pdf-preview-modal>

  <app-validation-modal
    [open]="showValidationModal"
    (openChange)="showValidationModal = $event"
    [characterName]="charState.activeCharacter()?.char_name"
    [isValidating]="isValidating"
    [validationResult]="validationResult"
    [isAutoFixing]="isAutoFixing"
    (applyAutoFix)="applyAutoFix()"
  ></app-validation-modal>

  <app-level-up-modal
    [open]="showLevelUpModal && !!levelUpAnalysis"
    (openChange)="showLevelUpModal = $event"
    [nextLevel]="(charState.activeCharacter()?.char_level || 1) + 1"
    [levelUpAnalysis]="levelUpAnalysis"
    (applyLevelUp)="applyLevelUp()"
  ></app-level-up-modal>

  <app-short-rest-modal
    [open]="showShortRestModal"
    (openChange)="showShortRestModal = $event"
    [classHitDieSize]="getClassHitDieSize()"
    [conModifier]="getConModifier()"
    [availableHitDice]="getAvailableHitDice()"
    [characterLevel]="charState.activeCharacter()?.char_level"
    [(shortRestDiceToSpend)]="shortRestDiceToSpend"
    (executeShortRest)="executeShortRest()"
  ></app-short-rest-modal>

  <app-join-campaign-modal
    [open]="showJoinModal"
    (openChange)="showJoinModal = $event"
    [(joinInviteCode)]="joinInviteCode"
    (joinCampaign)="joinCampaign()"
  ></app-join-campaign-modal>

  <app-portrait-modal
    [open]="showPortraitModal"
    (openChange)="showPortraitModal = $event"
    [(portraitPrompt)]="portraitPrompt"
    (generateAiPortrait)="generateAiPortrait()"
  ></app-portrait-modal>

  <app-strategy-guide-modal
    [open]="!!strategyGuideText"
    [strategyGuideText]="strategyGuideText"
    (closed)="strategyGuideText = null"
  ></app-strategy-guide-modal>

  <app-edit-sheet-modal
    [open]="showEditModal"
    (openChange)="showEditModal = $event"
    [editChar]="charState.activeCharacter()"
    (saveEditModal)="saveEditModal()"
  ></app-edit-sheet-modal>
</forge-page>
