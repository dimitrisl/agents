<forge-section variant="plain" density="compact" title="📜 Skill Proficiencies & Check Rollers">
  <label actions class="inline-flex items-center gap-2 text-label font-semibold text-muted">
    <input
      type="checkbox"
      class="h-4 w-4 accent-[var(--theme-accent)] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
      [(ngModel)]="showProficientOnly"
    />
    Show Proficient Only (⭐)
  </label>

  <p class="text-body-sm text-muted">
    Click ⭐/⚪ to toggle proficiency, or EXP for expertise. Roll checks with 🎲 Roll.
  </p>

  <div class="flex flex-col gap-2">
    <section *ngFor="let attr of skillAttributes" class="rounded-lg border border-hairline bg-black/20">
      <button
        type="button"
        class="flex w-full items-center justify-between gap-3 px-4 py-3 text-left font-display text-body font-bold text-ink transition-colors hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-deep"
        [attr.aria-expanded]="openGroups[attr]"
        [attr.aria-controls]="'skills-panel-' + attr"
        (click)="toggleGroup(attr)"
      >
        <span>{{ getAttributeFullName(attr) }} ({{ attr }})</span>
        <span aria-hidden="true">{{ openGroups[attr] ? '▼' : '►' }}</span>
      </button>

      <div *ngIf="openGroups[attr]" [id]="'skills-panel-' + attr" class="border-t border-hairline p-3">
        <div class="grid grid-cols-1 gap-2 md:grid-cols-2 2xl:grid-cols-3">
          <ng-container *ngFor="let skill of getSkillsByAttribute(attr)">
            <div
              *ngIf="!showProficientOnly || isProficient(skill.name)"
              class="flex items-center justify-between gap-3 rounded-lg border border-hairline bg-white/[0.03] px-3 py-2 transition-colors hover:border-hairline-bright"
            >
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 min-w-0">
                  <button
                    type="button"
                    class="text-sm transition-transform shrink-0 cursor-pointer hover:scale-125 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent rounded"
                    [ngClass]="{
                      'text-gold': isProficient(skill.name),
                      'text-muted hover:text-ink': !isProficient(skill.name)
                    }"
                    (click)="toggleProficiency.emit(skill.name)"
                    [attr.aria-label]="(isProficient(skill.name) ? 'Remove' : 'Add') + ' proficiency for ' + skill.name"
                    [title]="isProficient(skill.name) ? 'Proficient (click to remove)' : 'Untrained (click to train)'"
                  >
                    {{ isProficient(skill.name) ? '⭐' : '⚪' }}
                  </button>
                  <strong class="truncate text-body text-ink font-semibold" [title]="skill.name">{{ skill.name }}</strong>
                  <button
                    *ngIf="isProficient(skill.name)"
                    type="button"
                    class="cursor-pointer text-micro font-bold uppercase px-1.5 py-0.5 rounded transition-all"
                    [ngClass]="{
                      'bg-gold/20 text-gold border border-gold/40 shadow-sm': isExpertise(skill.name),
                      'bg-white/5 text-muted border border-hairline hover:text-ink hover:border-muted': !isExpertise(skill.name)
                    }"
                    (click)="toggleExpertise.emit(skill.name)"
                    [title]="isExpertise(skill.name) ? 'Expertise active (double PB) - click to remove' : 'Click to give Expertise (double PB)'"
                  >
                    {{ isExpertise(skill.name) ? '🌟 EXP' : 'EXP' }}
                  </button>
                </div>
              </div>

              <div class="flex shrink-0 items-center gap-1.5">
                <forge-badge tone="accent" size="md">{{ getSkillModString(skill) }}</forge-badge>
                <button forgeButton variant="secondary" size="sm" type="button" (click)="rollSkill.emit(skill)">
                  🎲 Roll
                </button>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </section>
  </div>
</forge-section>
