<div class="grid grid-cols-3 gap-2 sm:grid-cols-6 lg:grid-cols-3">
  <forge-stat-box
    *ngFor="let entry of entries; trackBy: trackByStatKey"
    [label]="entry.key"
    value=""
  >
    <ng-container value>
      <span *ngIf="!editMode" class="block text-metric font-extrabold text-accent">
        {{ entry.value }}
      </span>
      <input
        *ngIf="editMode"
        forgeInput
        type="number"
        [(ngModel)]="char.stats[entry.key]"
      />
      <span class="block text-label font-bold text-gold">
        ({{ getModifierString(char.stats[entry.key]) }})
      </span>
    </ng-container>

    <div class="mt-2 flex justify-center gap-1">
      <button forgeButton variant="secondary" size="sm" type="button" (click)="abilityCheck.emit(entry.key)">
        Check
      </button>
      <button forgeButton variant="secondary" size="sm" type="button" (click)="savingThrow.emit(entry.key)">
        Save
      </button>
    </div>
  </forge-stat-box>
</div>
