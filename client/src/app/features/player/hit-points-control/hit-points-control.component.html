<section class="py-3" aria-labelledby="hit-points-heading">
  <p
    id="hit-points-heading"
    class="text-micro font-semibold uppercase text-muted text-center"
  >
    {{ current === 0 ? 'Unconscious' : 'Hit Points' }}
  </p>

  <div class="mt-2 flex items-center justify-center gap-6">
    <div class="flex flex-col gap-2">
      <button
        forgeButton
        variant="secondary"
        size="sm"
        type="button"
        aria-label="Decrease hit points"
        (click)="applyHpChange(-1)"
      >
        Damage
      </button>
      <button
        class="text-micro font-semibold uppercase text-muted hover:text-gold transition-colors"
        (click)="applyTempHpChange(1)"
        aria-label="Add temp HP"
      >
        +Temp
      </button>
    </div>

    <div class="flex flex-col items-center min-w-[120px]">
      <div class="flex items-baseline justify-center relative">
        <span
          class="text-metric font-extrabold absolute -left-6 top-1"
          [ngClass]="current === 0 ? 'text-red-500' : 'text-accent'"
          aria-hidden="true"
          >♥</span
        >
        <span class="sr-only">Current hit points</span>
        <span class="text-[2rem] font-extrabold text-ink" [ngClass]="{'text-red-500': current === 0}">{{ current }}</span>
        <span class="px-1 text-title font-semibold text-muted">/</span>
        <span class="text-title font-semibold text-muted">{{ max }}</span>
      </div>

      <input
        type="number"
        class="mt-2 w-16 bg-surface border border-hairline rounded text-center text-body-sm font-semibold text-ink placeholder:text-muted/50"
        placeholder="1"
        min="1"
        [(ngModel)]="modifierAmount"
        aria-label="Amount to heal or damage"
      />

      <!-- Temp HP inline -->
      <div class="flex items-center gap-2 mt-2" *ngIf="temp > 0">
        <span class="text-body-sm font-semibold text-gold">{{ temp }} Temp</span>
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <button
        forgeButton
        variant="secondary"
        size="sm"
        type="button"
        aria-label="Increase hit points"
        (click)="applyHpChange(1)"
      >
        Heal
      </button>
      <button
        *ngIf="temp > 0"
        class="text-micro font-semibold uppercase text-muted hover:text-danger transition-colors"
        (click)="applyTempHpChange(-1)"
        aria-label="Remove temp HP"
      >
        -Temp
      </button>
    </div>
  </div>

  <!-- Normal HP Bar -->
  <div
    *ngIf="current > 0"
    class="mt-3 h-1 overflow-hidden rounded-full bg-tile"
    role="meter"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="max"
    [attr.aria-valuenow]="current"
    aria-label="Hit point total"
  >
    <div
      class="h-full rounded-full bg-accent transition-[width] duration-200"
      [style.width.%]="percentage"
    ></div>
  </div>

  <!-- Death Saves UI -->
  <div *ngIf="current === 0" class="mt-4 flex flex-col items-center">
    <p class="text-micro font-bold text-red-400 mb-2 uppercase tracking-wider">Death Saves</p>
    <div class="flex items-center gap-6 bg-red-900/10 border border-red-500/20 rounded-xl px-5 py-3">
      <!-- Successes -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-micro font-semibold text-ink uppercase">Successes</span>
        <div class="flex gap-2">
          <button *ngFor="let i of deathSaveArray"
            class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors"
            [ngClass]="(deathSaves?.successes || 0) >= i ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-muted hover:border-emerald-500'"
            (click)="toggleDeathSave('successes', i)"
            aria-label="Toggle death save success"
          >
            <svg *ngIf="(deathSaves?.successes || 0) >= i" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Divider -->
      <div class="w-px h-10 bg-red-500/20"></div>

      <!-- Failures -->
      <div class="flex flex-col items-center gap-2">
        <span class="text-micro font-semibold text-ink uppercase">Failures</span>
        <div class="flex gap-2">
          <button *ngFor="let i of deathSaveArray"
            class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors"
            [ngClass]="(deathSaves?.failures || 0) >= i ? 'bg-red-500 border-red-500 text-white' : 'border-muted hover:border-red-500'"
            (click)="toggleDeathSave('failures', i)"
            aria-label="Toggle death save failure"
          >
            <svg *ngIf="(deathSaves?.failures || 0) >= i" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
