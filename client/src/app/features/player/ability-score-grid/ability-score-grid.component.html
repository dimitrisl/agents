<section class="py-3" aria-labelledby="ability-scores-heading">
  <h3
    id="ability-scores-heading"
    class="text-micro font-semibold uppercase text-muted"
  >
    Ability Scores
  </h3>
  <div class="mt-2 grid grid-cols-3 gap-2">
    @for (entry of entries; track entry.key) {
      <article class="flex flex-col rounded-xl bg-tile p-2 text-center">
        <p class="text-micro font-semibold uppercase text-muted">{{ entry.key }}</p>

        <!-- Modifier is what gets rolled, so it leads; the raw score sits under it -->
        <p class="mt-1 text-metric font-bold leading-none tabular-nums text-ink">
          {{ getModifierString(char.stats[entry.key]) }}
        </p>
        @if (!editMode) {
          <span
            class="mx-auto mt-1.5 rounded-full border border-hairline px-2 text-micro font-semibold tabular-nums text-muted"
            [attr.aria-label]="entry.key + ' score ' + entry.value"
          >
            {{ entry.value }}
          </span>
        } @else {
          <input
            forgeInput
            type="number"
            class="mx-auto mt-1 max-w-16 text-center"
            [(ngModel)]="char.stats[entry.key]"
            [attr.aria-label]="entry.key + ' score'"
          />
        }

        <div class="mt-2 flex flex-col gap-1">
          <button
            type="button"
            class="flex min-h-7 items-center justify-between rounded-md bg-panel px-2 text-micro font-semibold text-muted transition-colors hover:bg-surface-hover hover:text-ink focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-accent"
            [attr.aria-label]="'Roll ' + entry.key + ' check, ' + getModifierString(char.stats[entry.key])"
            (click)="abilityCheck.emit(entry.key)"
          >
            <span>Check</span>
            <span class="tabular-nums">{{ getModifierString(char.stats[entry.key]) }}</span>
          </button>
          <button
            type="button"
            class="flex min-h-7 items-center justify-between rounded-md px-2 text-micro font-semibold transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-accent"
            [ngClass]="
              isProficient(entry.key)
                ? 'bg-accent/10 text-accent hover:bg-accent/20'
                : 'bg-panel text-muted hover:bg-surface-hover hover:text-ink'
            "
            [attr.aria-label]="
              'Roll ' + entry.key + ' saving throw, ' + saveModifier(entry.key) + (isProficient(entry.key) ? ' (proficient)' : '')
            "
            [title]="isProficient(entry.key) ? 'Proficient saving throw' : 'Saving throw'"
            (click)="savingThrow.emit(entry.key)"
          >
            <span class="flex items-center gap-1">
              @if (isProficient(entry.key)) {
                <span class="h-1.5 w-1.5 rounded-full bg-accent" aria-hidden="true"></span>
              }
              Save
            </span>
            <span class="tabular-nums">{{ saveModifier(entry.key) }}</span>
          </button>
        </div>
      </article>
    }
  </div>
</section>
