<forge-toolbar collapseAt="sm">
  <div leading class="flex min-w-0 flex-1 items-center gap-3">
    <label for="hero-vault-select" class="shrink-0 text-label font-bold uppercase tracking-[0.04em] text-muted">
      📜 Hero Vault ({{ edition }}):
    </label>
    <select
      forgeSelect
      id="hero-vault-select"
      class="min-w-48"
      [ngModel]="activeCharacterId"
      (ngModelChange)="selectCharacter.emit($event)"
    >
      <option *ngIf="characters.length === 0" [value]="null" disabled>
        ⚠️ No {{ edition }} Heroes found
      </option>
      <option *ngFor="let c of characters" [value]="c.char_id">
        {{ c.char_name }} (Lvl {{ c.char_level }} {{ c.char_class }})
      </option>
    </select>
  </div>

  <button forgeButton variant="primary" type="button" (click)="newHero.emit()">
    ✨ New Hero
  </button>
  <button forgeButton variant="secondary" type="button" (click)="editSheet.emit()">
    ✏️ Edit Sheet
  </button>
  <button forgeButton variant="secondary" type="button" (click)="quickEdit.emit()">
    {{ editMode ? '💾 Done Editing' : '⚡ Quick Edit' }}
  </button>
  <button forgeButton variant="secondary" type="button" (click)="joinCampaign.emit()">
    🔑 Join Campaign
  </button>
</forge-toolbar>
