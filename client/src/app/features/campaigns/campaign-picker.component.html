<forge-auth-shell>
  <div class="w-full max-w-xl">
    <div class="mb-8 flex justify-center">
      <svg
        class="h-16 w-16 text-accent"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <circle
          cx="50"
          cy="50"
          r="42"
          stroke="currentColor"
          stroke-width="5"
          fill="none"
          style="filter: drop-shadow(0 0 10px color-mix(in srgb, var(--theme-accent) 50%, transparent))"
        />
        <polygon
          points="50,15 85,35 85,75 50,90 15,75 15,35"
          stroke="currentColor"
          stroke-width="3"
          fill="color-mix(in srgb, var(--theme-accent) 10%, transparent)"
        />
        <line x1="50" y1="15" x2="50" y2="90" stroke="currentColor" stroke-width="3" />
        <line x1="15" y1="35" x2="85" y2="75" stroke="currentColor" stroke-width="2" />
        <line x1="15" y1="75" x2="85" y2="35" stroke="currentColor" stroke-width="2" />
      </svg>
    </div>

    <forge-card padding="lg" class="w-full">
      <div class="mb-6 flex items-center justify-between">
        <h1 class="font-display text-title text-ink">Your Campaigns</h1>
        <button
          forgeButton
          variant="secondary"
          size="sm"
          (click)="showJoinModal.set(true)"
        >
          <svg class="mr-2 h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" />
          </svg>
          Join via Code
        </button>
      </div>

      @if (loading()) {
        <div class="flex items-center justify-center py-12">
          <div class="h-8 w-8 animate-spin rounded-full border-4 border-accent border-r-transparent"></div>
        </div>
      } @else if (campaigns().length === 0) {
        <forge-empty-state
          icon="🏰"
          title="No Campaigns Yet"
          description="You are not part of any active campaigns."
        >
          <button
            forgeButton
            variant="primary"
            size="md"
            (click)="showJoinModal.set(true)"
          >
            Join a Campaign
          </button>
        </forge-empty-state>
      } @else {
        <div class="flex flex-col gap-2">
          @for (camp of campaigns(); track camp.campaign_name) {
            <forge-list-row
              [title]="camp.campaign_name"
              [description]="(camp.party.length || 0) + ' members'"
              (onClick)="onCampaignClick(camp)"
            >
              <ng-container trailing>
                @if (camp.role === 'dm') {
                  <forge-badge tone="accent" size="sm">DM</forge-badge>
                } @else {
                  <forge-badge tone="muted" size="sm">Player</forge-badge>
                }
              </ng-container>
            </forge-list-row>
          }
        </div>
      }
    </forge-card>

    <div class="mt-6 text-center">
      <button forgeButton variant="ghost" size="sm" (click)="logout()">
        Sign Out
      </button>
    </div>
  </div>
</forge-auth-shell>

@if (showJoinModal()) {
  <app-join-campaign-modal
    (close)="showJoinModal.set(false)"
    (joined)="onCampaignJoined()"
  />
}
