@if (isOpen()) {
  <div class="palette-backdrop" (click)="close()">
    <forge-card
      class="palette-card animated-fade"
      [hoverable]="false"
      padding="sm"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      (click)="$event.stopPropagation()"
      (keydown)="handlePaletteKeydown($event)"
    >
      <div class="flex items-center gap-3 rounded-lg border border-hairline bg-black/40 p-2">
        <span class="text-title" aria-hidden="true">ðŸ”</span>
        <input
          forgeInput
          type="text"
          placeholder="Type a command or search... (e.g. Forge, Rules, Rest)"
          [(ngModel)]="searchQuery"
          (input)="filterCommands()"
          #searchInput
        />
        <span class="rounded bg-white/10 px-2 py-1 text-micro text-muted">ESC</span>
      </div>

      <div
        class="mt-3 max-h-[350px] overflow-y-auto"
        role="listbox"
        aria-label="Command results"
      >
        @for (item of filteredCommands; track item.title; let i = $index) {
          <button
            #commandRow
            type="button"
            class="command-row"
            [class.selected]="i === selectedIndex"
            role="option"
            [attr.aria-selected]="i === selectedIndex"
            (click)="selectItem(item)"
          >
            <span class="flex min-w-0 items-center gap-2">
              <span class="text-title" aria-hidden="true">{{ item.icon }}</span>
              <strong class="truncate text-body">{{ item.title }}</strong>
            </span>

            <forge-badge tone="muted" size="sm">{{ item.category }}</forge-badge>
          </button>
        }

        @if (filteredCommands.length === 0) {
          <div class="p-6 text-center text-body text-muted">
            No matching commands found.
          </div>
        }
      </div>
    </forge-card>
  </div>
}
