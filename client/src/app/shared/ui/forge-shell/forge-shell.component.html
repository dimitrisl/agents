<div class="min-h-screen bg-deep text-ink" [ngClass]="shellClasses">
  @if (hasSidebar) {
    <!-- Mobile bar: only below `lg`, where the sidebar is off-canvas. -->
    <header
      class="sticky top-0 z-30 flex min-h-14 items-center gap-3 border-b border-hairline bg-surface/90 px-4 backdrop-blur-lg lg:hidden"
    >
      <button
        type="button"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-hairline bg-white/5 text-ink transition-colors hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-deep"
        aria-label="Open navigation"
        aria-controls="forge-shell-sidebar"
        [attr.aria-expanded]="drawerOpen()"
        (click)="openDrawer()"
      >
        ☰
      </button>

      @if (mobileTitle) {
        <span class="min-w-0 truncate font-display text-title">{{ mobileTitle }}</span>
      }
    </header>

    @if (drawerOpen()) {
      <div class="fixed inset-0 z-40 bg-black/60 lg:hidden" (click)="closeDrawer()"></div>
    }

    <!--
      ONE sidebar in the DOM, two presentations: an off-canvas drawer below `lg`,
      a static grid column at `lg` and up.

      Do not duplicate these <ng-content> slots for a separate drawer element —
      a projected node lands in exactly one slot (the first that matches), so the
      second copy would silently render nothing.
    -->
    <aside
      id="forge-shell-sidebar"
      class="fixed inset-y-0 left-0 z-50 flex w-72 max-w-[85vw] flex-col overflow-y-auto border-r border-hairline bg-surface p-4 shadow-card backdrop-blur-lg transition-transform duration-200 lg:static lg:visible lg:z-auto lg:h-screen lg:w-auto lg:max-w-none lg:translate-x-0 lg:shadow-none lg:transition-none"
      [ngClass]="drawerClasses"
      [cdkTrapFocus]="trapFocus"
      [cdkTrapFocusAutoCapture]="trapFocus"
    >
      <div class="mb-6 flex items-start justify-between gap-3">
        <ng-content select="[brand]"></ng-content>

        <button
          type="button"
          class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-hairline bg-white/5 text-ink transition-colors hover:bg-white/10 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent focus-visible:ring-offset-2 focus-visible:ring-offset-deep lg:hidden"
          aria-label="Close navigation"
          (click)="closeDrawer()"
        >
          ×
        </button>
      </div>

      <!-- Closes the drawer when a link is tapped; NavigationEnd covers the rest. -->
      <nav class="flex min-h-0 flex-1 flex-col gap-2" (click)="closeDrawer()">
        <ng-content select="[nav]"></ng-content>
      </nav>

      <div class="mt-6 border-t border-hairline pt-4">
        <ng-content select="[user]"></ng-content>
      </div>
    </aside>
  }

  <main class="min-w-0 lg:h-screen lg:overflow-y-auto">
    <ng-content></ng-content>
  </main>
</div>
