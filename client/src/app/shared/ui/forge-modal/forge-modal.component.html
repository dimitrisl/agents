<ng-template #modalTemplate>
  <section
    class="max-h-[85vh] overflow-y-auto rounded-[14px] border border-hairline p-6 text-ink shadow-card backdrop-blur-lg"
    [ngClass]="sheetOnMobile ? 'forge-mobile-sheet-section bg-deep' : 'bg-surface'"
  >
    @if (sheetOnMobile) {
      <div class="mx-auto mb-3 h-1 w-10 rounded-full bg-muted/40 lg:hidden" aria-hidden="true"></div>
    }
    <header class="mb-4 flex items-start justify-between gap-4">
      @if (title) {
        <h2 class="font-display text-title text-ink">{{ title }}</h2>
      }

      <button
        forgeButton
        variant="ghost"
        size="md"
        iconOnly
        type="button"
        aria-label="Close modal"
        (click)="close()"
      >
        <forge-icon name="close" />
      </button>
    </header>

    <ng-content></ng-content>
  </section>
</ng-template>
