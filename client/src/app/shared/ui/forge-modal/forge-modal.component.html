<ng-template #modalTemplate>
  <section class="max-h-[85vh] overflow-y-auto rounded-[14px] border border-hairline bg-surface p-6 text-ink shadow-card backdrop-blur-lg">
    <header class="mb-4 flex items-start justify-between gap-4">
      @if (title) {
        <h2 class="font-display text-title text-ink">{{ title }}</h2>
      }

      <button
        forgeButton
        variant="ghost"
        size="sm"
        iconOnly
        type="button"
        aria-label="Close modal"
        (click)="close()"
      >
        ×
      </button>
    </header>

    <ng-content></ng-content>
  </section>
</ng-template>
