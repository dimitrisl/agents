<div class="mx-auto flex max-w-xl flex-col items-center gap-3 py-10 text-center">
  @if (icon) {
    <div class="text-display" aria-hidden="true">{{ icon }}</div>
  }

  <h2 class="font-display text-title text-ink">
    {{ title }}
  </h2>

  @if (description) {
    <p class="text-body text-muted">
      {{ description }}
    </p>
  }

  <div class="mt-2 flex flex-wrap items-center justify-center gap-2">
    <ng-content></ng-content>
  </div>
</div>
