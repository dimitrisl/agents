name: Create issue branch

on:
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write

jobs:
  create-branch:
    if: github.event.label.name == 'create-branch'
    runs-on: ubuntu-latest

    steps:
      - name: Create branch from issue
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(label =>
              typeof label === 'string' ? label : label.name
            );

            // Checked in this order, so the first match wins when an issue
            // carries more than one type label.
            const prefixByLabel = {
              bug: 'fix',
              feature: 'feat',
              enhancement: 'feat',
              improvement: 'improve',
              'tech-debt': 'chore',
              documentation: 'docs'
            };

            const typeLabel = Object.keys(prefixByLabel).find(label =>
              labels.includes(label)
            );

            if (!typeLabel) {
              const supported = Object.keys(prefixByLabel)
                .map(label => `\`${label}\``)
                .join(', ');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '⚠️ No branch was created: this issue has no type label.',
                  '',
                  `Add one of ${supported}, then re-apply the \`create-branch\` label.`
                ].join('\n')
              });

              core.notice(`Issue #${issue.number} has no type label. No branch created.`);
              return;
            }

            const prefix = prefixByLabel[typeLabel];

            // Non-latin titles (e.g. Greek) reduce to an empty slug, so fall
            // back to a fixed word to avoid a branch ending in a bare dash.
            const slug = issue.title
              .toLowerCase()
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .substring(0, 60)
              .replace(/-+$/, '') || 'issue';

            const branchName = `${prefix}/${issue.number}-${slug}`;
            const baseBranch = 'dev';

            const { data: baseRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${baseBranch}`
            });

            try {
              // createLinkedBranch creates the branch *and* registers it under
              // the issue's Development sidebar, the same as the "Create a
              // branch" button. github.rest.git.createRef would only do the
              // former, leaving the sidebar empty.
              const result = await github.graphql(
                `mutation($issue: ID!, $repository: ID!, $name: String!, $oid: GitObjectID!) {
                   createLinkedBranch(input: {
                     issueId: $issue,
                     repositoryId: $repository,
                     name: $name,
                     oid: $oid
                   }) {
                     linkedBranch { ref { name } }
                   }
                 }`,
                {
                  issue: issue.node_id,
                  repository: context.payload.repository.node_id,
                  name: branchName,
                  oid: baseRef.object.sha
                }
              );

              // Report whatever GitHub actually named the ref rather than
              // assuming it honoured `branchName` verbatim.
              const createdName =
                result.createLinkedBranch.linkedBranch.ref.name;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [
                  '🌿 Development branch created automatically:',
                  '',
                  `\`${createdName}\``,
                  '',
                  `Base branch: \`${baseBranch}\``
                ].join('\n')
              });
            } catch (error) {
              if (/already exists/i.test(error.message || '')) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `⚠️ Branch \`${branchName}\` already exists.`
                });

                return;
              }

              throw error;
            }
